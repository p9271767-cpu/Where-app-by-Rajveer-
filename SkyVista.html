<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081028" id="tc">
<title>SkyVista</title>
<meta name="author" content="Rajveer Singh Rana">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg-top: #070d24;
  --bg-mid: #101b3f;
  --bg-bot: #162652;
  --card-bg: rgba(7, 13, 36, 0.72);
  --card-bg-2: rgba(11, 19, 48, 0.84);
  --card-border: rgba(255, 255, 255, 0.11);
  --card-hi: rgba(255, 255, 255, 0.09);
  --text: #ffffff;
  --mut: rgba(226, 234, 250, 0.72);
  --mut2: rgba(196, 210, 236, 0.52);
  --ln: rgba(255, 255, 255, 0.11);
  --ac: #8ab4ff;
  --pill-bg: rgba(255, 255, 255, 0.12);
  --cloud-color: rgba(160, 185, 230, 0.22);
  --cloud-op: 0.45;
  --shade-op: 0.25;
}

* {
  box-sizing: border-box;
  margin: 0;
  -webkit-tap-highlight-color: transparent;
}

html {
  -webkit-text-size-adjust: 100%;
  background: #070d24 !important;
  color-scheme: dark;
}

body {
  font: 400 15px/1.45 "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  background: #070d24 !important;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
}

button, input, select {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: 0;
  background: var(--pill-bg);
  border-radius: 14px;
  padding: 10px 15px;
  transition: background 0.2s ease, transform 0.12s ease, opacity 0.2s ease;
}

button:hover { background: rgba(255, 255, 255, 0.2); }
button:active { transform: scale(0.96); }
:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.off, .hid { display: none !important; }

/* =========================================================
   LIVE TIME-OF-DAY ATMOSPHERIC SKY ENGINE
   ========================================================= */
.sky-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  transition: opacity 1.4s ease;
}

.sky-photos {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  transition: filter 1.2s ease;
}

.sky-photo {
  position: absolute;
  inset: -6% -8%;
  width: 116%;
  height: 112%;
  object-fit: cover;
  object-position: center top;
  opacity: 0;
  transition: opacity 1.4s ease;
  will-change: transform, opacity;
  animation: skyDrift 65s ease-in-out infinite alternate;
}

.sky-photo.on { opacity: 1; }

@keyframes skyDrift {
  0% { transform: scale(1.04) translate3d(-2.2%, 0, 0); }
  100% { transform: scale(1.08) translate3d(2.2%, -1%, 0); }
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.sky-shade {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: var(--shade-grad, linear-gradient(180deg, rgba(4, 8, 22, 0.24) 0%, rgba(4, 8, 22, 0.04) 40%, rgba(5, 10, 26, 0.52) 100%));
  transition: background 1.2s ease;
}

/* Optical Sun Lens Flare + Soft Prism Halo (Daytime) */
.sun-flare {
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.1s ease;
  overflow: hidden;
}

.sun-flare .halo {
  position: absolute;
  width: 460px;
  height: 460px;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle,
    transparent 52%,
    rgba(255, 225, 165, 0.14) 59%,
    rgba(130, 225, 255, 0.16) 65%,
    rgba(165, 140, 255, 0.12) 70%,
    transparent 77%);
  filter: blur(5px);
}

.sun-flare .bokeh {
  position: absolute;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(210, 235, 255, 0.14) 70%, rgba(255, 255, 255, 0.28) 92%, transparent 100%);
  border: 1px solid rgba(255, 255, 255, 0.16);
}

/* Celestial Sun & Realistic Moon */
.celestial {
  position: absolute;
  transform: translate(-50%, -50%);
  transition: left 1.4s cubic-bezier(0.25, 0.8, 0.25, 1), top 1.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 1.1s ease;
  pointer-events: none;
}

.sun-orb {
  position: fixed;
  z-index: 2;
  width: 114px;
  height: 114px;
  border-radius: 50%;
  mix-blend-mode: screen;
  pointer-events: none;
  animation: sunPulse 6.5s ease-in-out infinite;
}

.sun-orb::before {
  content: "";
  position: absolute;
  inset: -34%;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(255, 253, 232, 0.94) 0%,
    rgba(255, 230, 148, 0.62) 28%,
    rgba(255, 200, 102, 0.24) 54%,
    transparent 74%);
  pointer-events: none;
}

.sun-orb img {
  position: relative;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
  filter: brightness(1.22) contrast(1.08) saturate(1.16);
  -webkit-mask-image: radial-gradient(circle, #000 52%, transparent 74%);
  mask-image: radial-gradient(circle, #000 52%, transparent 74%);
}

@keyframes sunPulse {
  50% { transform: translate(-50%, -50%) scale(1.05); }
}

.moon-orb {
  position: fixed;
  z-index: 2;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  pointer-events: none;
  mix-blend-mode: screen;
  filter: drop-shadow(0 0 18px rgba(215, 230, 255, 0.78));
}

.moon-photo-wrap {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  overflow: hidden;
  -webkit-mask-image: radial-gradient(circle, #000 66%, transparent 71%);
  mask-image: radial-gradient(circle, #000 66%, transparent 71%);
}

.moon-photo-wrap img {
  width: 102%;
  height: 102%;
  margin: -1%;
  object-fit: cover;
  display: block;
}

.moon-phase-mask {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#cloudCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

#fx {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* =========================================================
   TOP HEADER BAR (Matches Screenshot)
   ========================================================= */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 30;
  padding: max(14px, env(safe-area-inset-top)) 18px 10px;
  transition: background 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease;
}

.topbar.scrolled {
  background: var(--bar-bg, rgba(8, 14, 34, 0.82));
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  backdrop-filter: blur(22px) saturate(1.4);
}

.topbar-inner {
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.city-head {
  min-width: 0;
  cursor: pointer;
}

.city-name {
  font-size: 23px;
  font-weight: 500;
  letter-spacing: -0.015em;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
}

.city-dots {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 5px;
}

.city-dots .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.35);
  transition: background 0.25s, transform 0.25s;
}

.city-dots .dot.on {
  background: #ffffff;
  transform: scale(1.2);
}

.city-dots svg {
  width: 11px;
  height: 11px;
  fill: rgba(255, 255, 255, 0.72);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.icon-btn {
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 50%;
  background: transparent;
  display: grid;
  place-items: center;
  color: #ffffff;
}

.icon-btn:hover { background: rgba(255, 255, 255, 0.14); }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; }

/* =========================================================
   MAIN SCROLLABLE COLUMN
   ========================================================= */
.wrap {
  position: relative;
  z-index: 3;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 0 14px calc(76px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* =========================================================
   HERO SECTION (Matches Screenshot 4)
   ========================================================= */
.hero {
  text-align: center;
  padding: calc(env(safe-area-inset-top) + 126px) 12px 34px;
  text-shadow: 0 3px 22px rgba(0, 0, 0, 0.32);
  transition: opacity 0.25s ease;
}

.hero-temp {
  display: inline-flex;
  align-items: flex-start;
  justify-content: center;
  font-size: clamp(92px, 26vw, 118px);
  font-weight: 300;
  line-height: 0.94;
  letter-spacing: -0.04em;
  margin-left: 16px;
}

.hero-temp sup {
  font-size: 0.42em;
  font-weight: 300;
  margin-top: 0.18em;
  margin-left: 2px;
}

.hero-meta {
  margin-top: 14px;
  font-size: 15.5px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.94);
  letter-spacing: 0.01em;
}

.hero-meta span { margin: 0 6px; }

.hero-phase {
  margin-top: 12px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(8, 14, 34, 0.34);
  border: 1px solid rgba(255, 255, 255, 0.14);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  font-size: 12px;
  color: rgba(240, 246, 255, 0.9);
}

.live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #6ee7b7;
  box-shadow: 0 0 8px #6ee7b7;
}

.preview-bar {
  margin-top: 10px;
}

.preview-bar button {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  background: rgba(12, 22, 48, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.22);
}

/* =========================================================
   DARK TRANSLUCENT CARDS (Matches Screenshots 1–4)
   ========================================================= */
.card {
  border-radius: 22px;
  padding: 16px 18px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: inset 0 1px 0 var(--card-hi), 0 8px 24px rgba(0, 0, 0, 0.22);
  -webkit-backdrop-filter: blur(22px) saturate(1.35);
  backdrop-filter: blur(22px) saturate(1.35);
}

.card-h {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 12px;
  margin-bottom: 14px;
  border-bottom: 1px solid var(--ln);
  font-size: 14px;
  font-weight: 500;
  color: var(--mut);
}

.card-h.clickable { cursor: pointer; }
.card-h .chev { font-size: 18px; color: var(--mut); line-height: 1; }

/* Alert Banner */
.alert-box {
  padding: 13px 16px;
  border-radius: 18px;
  background: rgba(112, 66, 12, 0.78);
  border: 1px solid rgba(255, 208, 120, 0.45);
  font-size: 13.5px;
  line-height: 1.45;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
}

/* =========================================================
   INSIGHT CAROUSEL CARD (Pollen / Brief / Pitch Cast)
   ========================================================= */
.insight-top {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 17px;
  font-weight: 500;
}

.insight-top svg { width: 22px; height: 22px; flex-shrink: 0; }
.insight-sub { font-size: 14px; color: rgba(255, 255, 255, 0.88); margin-top: 6px; }
.insight-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 12px;
  padding: 0;
  background: none;
  color: var(--mut);
  font-size: 13.5px;
}
.insight-link:hover { background: none; color: #fff; }

.aqi-ins-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.aqi-ring {
  width: 68px;
  height: 68px;
  flex: 0 0 68px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  position: relative;
}

.aqi-ring-inner {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: var(--ring-core, rgba(58, 128, 226, 0.88));
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 600;
}

.carousel-dots {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 8px;
}

.carousel-dots button {
  width: 6px;
  height: 6px;
  padding: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.28);
}

.carousel-dots button.on {
  background: #ffffff;
  width: 14px;
  border-radius: 6px;
}

/* =========================================================
   HOURLY STRIP (Matches Screenshot 4)
   ========================================================= */
.hourly-strip {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -8px;
  padding: 2px 6px;
}
.hourly-strip::-webkit-scrollbar { display: none; }

.hr-item {
  flex: 0 0 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 8px 4px;
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.2s;
}

.hr-item:hover { background: rgba(255, 255, 255, 0.08); }
.hr-item.sel { background: rgba(255, 255, 255, 0.14); }
.hr-time { font-size: 13px; color: var(--mut); white-space: nowrap; }
.hr-item.sel .hr-time { color: #fff; font-weight: 600; }
.hr-ic { width: 28px; height: 28px; }
.hr-temp { font-size: 16px; font-weight: 500; }

/* =========================================================
   MULTI-DAY FORECAST WITH LINE / LIST TOGGLE (Screenshots 3 & 4)
   ========================================================= */
.seg-pill {
  display: inline-flex;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  padding: 3px;
  gap: 2px;
}

.seg-pill button {
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 500;
  background: transparent;
  color: var(--mut);
}

.seg-pill button.on {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
}

.md-scroll {
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 -10px;
  padding: 4px 10px 0;
}
.md-scroll::-webkit-scrollbar { display: none; }

.md-inner {
  position: relative;
  min-width: 560px;
}

.md-cols {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  text-align: center;
}

.md-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 4px 2px;
}

.md-day { font-size: 14.5px; font-weight: 500; }
.md-date { font-size: 12px; color: var(--mut); margin-top: 2px; }
.md-cond { font-size: 12px; color: rgba(255, 255, 255, 0.88); margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 76px; }
.md-ic { width: 28px; height: 28px; margin-top: 6px; }
.md-rain { height: 16px; font-size: 11px; color: #8fd3ff; margin-top: 2px; }
.md-hi { font-size: 16px; font-weight: 500; margin-top: 8px; }
.md-lo { font-size: 15.5px; font-weight: 400; color: rgba(255, 255, 255, 0.88); margin-top: 4px; }

.md-svg-wrap {
  width: 100%;
  height: 112px;
  margin: 4px 0;
}

.md-list-row {
  display: grid;
  grid-template-columns: 78px 30px minmax(0, 1fr) 74px;
  align-items: center;
  gap: 10px;
  padding: 10px 4px;
  border-top: 1px solid var(--ln);
}
.md-list-row:first-child { border-top: 0; }

.bar2 {
  height: 5px;
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.14);
  position: relative;
}
.bar2 i {
  position: absolute;
  top: 0;
  bottom: 0;
  border-radius: 9px;
  background: linear-gradient(90deg, #6ec6ff, #ffe08a, #ff8a5c);
}

.view-btn {
  width: 100%;
  margin-top: 16px;
  padding: 12px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.11);
  font-size: 14.5px;
  font-weight: 500;
  color: #fff;
}

/* =========================================================
   AIR QUALITY CARD (Matches Screenshots 2 & 3)
   ========================================================= */
.aqi-title {
  font-size: 22px;
  font-weight: 500;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.aqi-title b { font-size: 24px; font-weight: 600; }
.aqi-desc {
  font-size: 13.5px;
  color: rgba(235, 242, 255, 0.86);
  line-height: 1.5;
  margin: 8px 0 14px;
}

.aqi-bar {
  position: relative;
  height: 6px;
  border-radius: 999px;
  background: linear-gradient(90deg, #4ade80 0%, #a3e635 18%, #facc15 35%, #fb923c 55%, #c084fc 78%, #ef4444 100%);
}

.aqi-dot {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fde047;
  border: 2.5px solid #091026;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.55);
}

/* =========================================================
   3×2 METRICS GRID (Matches Screenshots 2 & 3)
   ========================================================= */
.grid-6 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.m-tile {
  border-radius: 20px;
  padding: 15px 14px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  box-shadow: inset 0 1px 0 var(--card-hi);
  -webkit-backdrop-filter: blur(22px) saturate(1.35);
  backdrop-filter: blur(22px) saturate(1.35);
  display: flex;
  flex-direction: column;
  gap: 5px;
  min-width: 0;
}

.m-tile svg {
  width: 22px;
  height: 22px;
  stroke: #ffffff;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  margin-bottom: 4px;
}

.m-lbl {
  font-size: 12.5px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.m-val {
  font-size: 22px;
  font-weight: 500;
  line-height: 1.15;
  white-space: nowrap;
}

.m-val small {
  font-size: 13px;
  font-weight: 400;
  color: rgba(255, 255, 255, 0.85);
  margin-left: 3px;
}

/* =========================================================
   SUNSET / SUNRISE TIMELINE CARD (Matches Screenshots 1 & 2)
   ========================================================= */
.sun-card {
  position: relative;
  overflow: hidden;
}

.sun-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(circle at 68% 52%, rgba(72, 118, 255, 0.24), transparent 62%);
}

.sun-row {
  position: relative;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.sun-end {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sun-end.right { align-items: flex-end; text-align: right; }
.sun-end svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.sun-end span { font-size: 13px; color: var(--mut); }

.sun-track {
  position: relative;
  height: 5px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  margin: 18px 0 16px;
}

.sun-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(145, 175, 255, 0.35), rgba(185, 210, 255, 0.85));
}

.sun-marker {
  position: absolute;
  top: 50%;
  width: 26px;
  height: 26px;
  transform: translate(-50%, -50%);
  display: grid;
  place-items: center;
  filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.75));
}

.sun-times {
  position: relative;
  display: flex;
  justify-content: space-between;
  font-size: 19px;
  font-weight: 500;
}
.sun-times small { font-size: 14px; font-weight: 400; margin-left: 2px; }

/* =========================================================
   MOON PHASE CARD (Matches Screenshots 1 & 2)
   ========================================================= */
.moon-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.moon-info { flex: 1; min-width: 0; }
.moon-phase-name { font-size: 14px; color: var(--mut); margin-bottom: 14px; }
.moon-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 0;
  border-top: 1px solid var(--ln);
  font-size: 15px;
}
.moon-row:first-of-type { border-top: 0; padding-top: 0; }
.moon-row b { font-size: 17px; font-weight: 500; }
.moon-row small { font-size: 13px; font-weight: 400; margin-left: 2px; }

.moon-disc {
  position: relative;
  width: 98px;
  height: 98px;
  flex: 0 0 98px;
  border-radius: 50%;
  overflow: hidden;
  mix-blend-mode: screen;
  -webkit-mask-image: radial-gradient(circle, #000 67%, transparent 71%);
  mask-image: radial-gradient(circle, #000 67%, transparent 71%);
}
.moon-disc img {
  width: 102%;
  height: 102%;
  margin: -1%;
  object-fit: cover;
  display: block;
}

/* =========================================================
   LIFESTYLE TIPS 3×3 GRID (Matches Screenshot 1)
   ========================================================= */
.life-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 18px 10px;
  padding-top: 4px;
}

.life-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 7px;
  cursor: pointer;
  padding: 6px 4px;
  border-radius: 14px;
  transition: background 0.2s;
}
.life-item:hover { background: rgba(255, 255, 255, 0.08); }
.life-item svg { width: 25px; height: 25px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.life-item span { font-size: 12.5px; color: var(--mut); line-height: 1.35; }

/* =========================================================
   SMART TOOLS STRIP (Radar, Compare, Mixer, Pitch, Packing)
   ========================================================= */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.tool-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 13px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.09);
  text-align: left;
}
.tool-btn:hover { background: rgba(255, 255, 255, 0.15); }
.tool-btn svg { width: 20px; height: 20px; stroke: var(--ac); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.tool-btn b { display: block; font-size: 13.5px; font-weight: 500; }
.tool-btn small { display: block; font-size: 11.5px; color: var(--mut); }

.brand-foot {
  text-align: center;
  padding: 14px 0 8px;
  font-size: 14px;
  font-weight: 500;
  color: rgba(200, 215, 240, 0.48);
  letter-spacing: 0.02em;
}
.brand-foot small { display: block; font-size: 11px; font-weight: 400; margin-top: 3px; opacity: 0.8; }

/* =========================================================
   DRAWERS / MODALS (Places, Settings, Tool Views, AI Chat)
   ========================================================= */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 60;
  visibility: hidden;
  transition: visibility 0s 0.38s;
}
.sheet.on { visibility: visible; transition-delay: 0s; }
.sheet-bk {
  position: absolute;
  inset: 0;
  background: rgba(2, 6, 18, 0.72);
  opacity: 0;
  transition: opacity 0.3s;
}
.sheet.on .sheet-bk { opacity: 1; }

.sheet-panel {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 560px;
  margin: 0 auto;
  max-height: 88dvh;
  display: flex;
  flex-direction: column;
  border-radius: 26px 26px 0 0;
  background: #0b1430;
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.65);
  transform: translateY(105%);
  transition: transform 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
  overflow: hidden;
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.on .sheet-panel { transform: none; }

@media (min-width: 640px) {
  .sheet-panel {
    bottom: 18px;
    border-radius: 26px;
    max-height: 84vh;
  }
}

.sheet-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--ln);
}
.sheet-head b { font-size: 17px; font-weight: 600; }

.sheet-body {
  padding: 16px 18px 22px;
  overflow-y: auto;
  overscroll-behavior: contain;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Form controls inside drawers */
.search-row { display: flex; gap: 8px; }
.search-row input {
  flex: 1;
  min-width: 0;
  padding: 12px 15px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(255, 255, 255, 0.16);
  outline: 0;
  font-size: 15px;
}
.search-row input:focus { border-color: var(--ac); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chips button { padding: 8px 13px; border-radius: 999px; font-size: 13px; }
.chips button.on { background: var(--ac); color: #071024; font-weight: 600; }

.saved-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 15px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.1);
  cursor: pointer;
}
.saved-row b { font-size: 15.5px; font-weight: 500; }
.saved-row small { display: block; color: var(--mut); font-size: 12px; }

.seg-row { display: flex; gap: 6px; flex-wrap: wrap; }
.seg-row button { flex: 1; min-height: 40px; font-size: 13.5px; }
.seg-row button.on { background: var(--ac); color: #071024; font-weight: 600; }

.kv { display: flex; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--ln); font-size: 14px; }
.kv:first-child { border-top: 0; }
.kv span { color: var(--mut); }

.radar-map { width: 100%; height: 330px; border-radius: 16px; overflow: hidden; border: 1px solid var(--card-border); background: #071024; }
.radar-pin { background: rgba(9, 16, 38, 0.92); color: #fff; border: 1.5px solid var(--ac); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }

.cmp-pick { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.cmp-pick select { width: 100%; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.16); color: #fff; outline: 0; }
.cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp-col { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 16px; padding: 12px; }
.cmp-col.win { border-color: #6ee7b7; background: rgba(110, 231, 183, 0.08); }

.rng { width: 100%; accent-color: var(--ac); margin: 6px 0; cursor: pointer; }
.pack-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 13px; background: rgba(255, 255, 255, 0.07); cursor: pointer; }
.pack-item.done { opacity: 0.52; text-decoration: line-through; }
.pack-box { width: 19px; height: 19px; border-radius: 5px; border: 2px solid var(--ac); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex-shrink: 0; }
.pack-item.done .pack-box { background: var(--ac); color: #071024; }

.vd { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.08); border-left: 4px solid var(--vc, var(--ac)); }
.vd span { color: var(--vc, var(--ac)); font-weight: 700; }

/* AI FAB & Chat */
.fab {
  position: fixed;
  z-index: 35;
  right: max(16px, env(safe-area-inset-right));
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: 50px;
  height: 50px;
  border-radius: 50%;
  padding: 0;
  background: linear-gradient(135deg, #7cc4ff, #a78bfa);
  display: grid;
  place-items: center;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
}
.fab:hover { background: linear-gradient(135deg, #8fd0ff, #b69cff); transform: scale(1.06); }

.chat-msgs { display: flex; flex-direction: column; gap: 9px; min-height: 220px; max-height: 46dvh; overflow-y: auto; }
.bb { max-width: 88%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
.bb.u { align-self: flex-end; background: var(--ac); color: #071024; font-weight: 500; }
.bb.a { align-self: flex-start; background: rgba(255, 255, 255, 0.1); }

.toast {
  position: fixed;
  z-index: 90;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom));
  transform: translate(-50%, 16px);
  opacity: 0;
  pointer-events: none;
  padding: 10px 16px;
  border-radius: 14px;
  background: rgba(9, 16, 38, 0.94);
  border: 1px solid rgba(255, 255, 255, 0.16);
  font-size: 13px;
  transition: 0.3s ease;
  max-width: 90vw;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

body.busy:before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  height: 2.5px;
  width: 38%;
  background: var(--ac);
  z-index: 95;
  animation: ldb 1s ease-in-out infinite;
}
@keyframes ldb { 0% { left: -38%; } to { left: 100%; } }
</style>
</head>

  // =========================================================
  // PROCEDURAL PHOTOREALISTIC CRATERED MOON RENDERER

  function moonPhase(ms) {
    const p = ((ms / 864e5 + 2440587.5 - 2451550.1) / 29.530588853 % 1 + 1) % 1;
    const ill = (1 - Math.cos(2 * Math.PI * p)) / 2;
    const name =
      p < 0.03 || p > 0.97 ? "New moon" :
      p < 0.22 ? "Waxing crescent" :
      p < 0.28 ? "First quarter" :
      p < 0.47 ? "Waxing gibbous" :
      p < 0.53 ? "Full moon" :
      p < 0.72 ? "Waning gibbous" :
      p < 0.78 ? "Last quarter" : "Waning crescent";
    return { p, ill, name };
  }

  function moonPhaseShadowSVG(phase, uid = "m1") {
    const waxing = phase <= 0.5;
    const cosP = Math.cos(phase * Math.PI * 2);
    const rx = Math.abs(cosP) * 50;
    const sweep1 = waxing ? 0 : 1;
    const sweep2 = waxing ? (cosP < 0 ? 1 : 0) : (cosP < 0 ? 0 : 1);
    const d = `M 50 0 A 50 50 0 0 ${sweep1} 50 100 A ${rx.toFixed(2)} 50 0 0 ${sweep2} 50 0 Z`;
    return `<defs><filter id="mblur-${uid}"><feGaussianBlur stdDeviation="2.6"/></filter></defs><path d="${d}" fill="rgba(5,9,24,0.88)" filter="url(#mblur-${uid})"/>`;
  }

  // =========================================================

  const cloudState = {

  };

  function buildClouds(W, H) {
    cloudState.layers = [];
    const specs = [
      { count: 6, yMin: 0.02, yMax: 0.28, speed: 0.14, scale: 1.25, alpha: 0.34 },
      { count: 7, yMin: 0.08, yMax: 0.42, speed: 0.26, scale: 0.95, alpha: 0.48 },
      { count: 5, yMin: 0.16, yMax: 0.54, speed: 0.42, scale: 0.72, alpha: 0.38 }
    ];
    specs.forEach((sp, li) => {
      for (let i = 0; i < sp.count; i++) {
        const puffs = [];
        const puffCount = 6 + Math.floor(Math.random() * 5);
        for (let p = 0; p < puffCount; p++) {
          puffs.push({
            ox: (p / (puffCount - 1) - 0.5) * 210 * sp.scale + (Math.random() - 0.5) * 38,
            oy: (Math.random() - 0.5) * 44 * sp.scale - Math.sin((p / (puffCount - 1)) * Math.PI) * 24 * sp.scale,
            rx: (55 + Math.random() * 52) * sp.scale,
            ry: (26 + Math.random() * 24) * sp.scale
          });
        }
        cloudState.layers.push({
          x: Math.random() * (W + 460) - 230,
          y: (sp.yMin + Math.random() * (sp.yMax - sp.yMin)) * H,
          vx: sp.speed * (0.75 + Math.random() * 0.5),
          baseAlpha: sp.alpha,
          layer: li,
          puffs
        });
      }
    });
  }

  const CLOUD_PALETTES = {
    dawn:     { top: [255, 214, 194], bot: [122, 86, 134] },
    morning:  { top: [255, 255, 255], bot: [192, 220, 248] },
    day:      { top: [255, 255, 255], bot: [186, 216, 246] },
    golden:   { top: [255, 204, 150], bot: [128, 72, 112] },
    twilight: { top: [176, 186, 228], bot: [52, 62, 108] },

    rain:     { top: [158, 176, 202], bot: [54, 68, 92] }

  function startLiveClouds(phase, kind) {
    cloudState.phase = phase;
    cloudState.kind = kind;
    const cv = $id("cloudCanvas");
    if (!cv) return;
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const W = innerWidth, H = innerHeight;
    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      buildClouds(W, H);
    } else if (!cloudState.layers.length) {
      buildClouds(W, H);
    }
    if (cloudState.raf) return;
    const ctx = cv.getContext("2d");

    (function drawFrame() {
      const cW = innerWidth, cH = innerHeight, cDpr = Math.min(devicePixelRatio || 1, 2);
      ctx.setTransform(cDpr, 0, 0, cDpr, 0, 0);
      ctx.clearRect(0, 0, cW, cH);

      const k = cloudState.kind;
      const pal = CLOUD_PALETTES[k === "storm" ? "storm" : k === "rain" ? "rain" : cloudState.phase] || CLOUD_PALETTES.night;
      const density = k === "clear" ? 0.22 : k === "partly" ? 0.42 : k === "cloud" || k === "fog" ? 0.68 : 0.82;

      for (let i = 0; i < cloudState.layers.length; i++) {
        const cl = cloudState.layers[i];
        cl.x += cl.vx;
        if (cl.x > cW + 260) cl.x = -260;

        const op = Math.min(0.85, cl.baseAlpha * density);
        for (let j = 0; j < cl.puffs.length; j++) {
          const pf = cl.puffs[j];
          const px = cl.x + pf.ox;
          const py = cl.y + pf.oy;
          const g = ctx.createRadialGradient(px, py - pf.ry * 0.25, pf.ry * 0.1, px, py, pf.rx);
          g.addColorStop(0, `rgba(${pal.top[0]},${pal.top[1]},${pal.top[2]},${op.toFixed(3)})`);
          g.addColorStop(0.55, `rgba(${pal.bot[0]},${pal.bot[1]},${pal.bot[2]},${(op * 0.55).toFixed(3)})`);
          g.addColorStop(1, `rgba(${pal.bot[0]},${pal.bot[1]},${pal.bot[2]},0)`);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(px, py, pf.rx, pf.ry, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      cloudState.raf = requestAnimationFrame(drawFrame);
    })();
  }

  function getTimePhase(hourFloat, riseHr, setHr) {
    if (hourFloat >= riseHr - 0.5 && hourFloat < riseHr + 1.0) return "dawn";
    if (hourFloat >= riseHr + 1.0 && hourFloat < 11.2) return "morning";
    if (hourFloat >= 11.2 && hourFloat < setHr - 1.2) return "day";
    if (hourFloat >= setHr - 1.2 && hourFloat < setHr + 0.45) return "golden";
    if (hourFloat >= setHr + 0.45 && hourFloat < setHr + 1.15) return "twilight";

    const phaseKey = getTimePhase(hourFloat, riseHr, setHr);

    let pal = [...base.sky];
    if (kind === "storm") pal = ["#0a0e1a", "#1c2338", "#323c58"];
    else if (kind === "rain") pal = isNight ? ["#081020", "#142238", "#223650"] : ["#2b3d54", "#475e78", "#748ca2"];
    else if (kind === "cloud" && !isNight) pal = ["#3d546e", "#607892", "#95aabd"];
    else if (kind === "fog" && !isNight) pal = ["#546573", "#7d909e", "#aebdc7"];

    const key = `${phaseKey}-${kind}-${round(hourFloat * 2)}`;
    if (key !== lastSkyKey) {
      lastSkyKey = key;
      const inEl = $id(bgFlip ? "bg1" : "bg2");
      const outEl = $id(bgFlip ? "bg2" : "bg1");
      inEl.style.background = `linear-gradient(180deg, ${pal[0]} 0%, ${pal[1]} 52%, ${pal[2]} 100%)`;
      inEl.style.zIndex = 1;
      outEl.style.zIndex = 0;
      inEl.style.opacity = 0;
      requestAnimationFrame(() => requestAnimationFrame(() => { inEl.style.opacity = 1; }));
      bgFlip ^= 1;
      $id("tc").content = pal[0];

      const root = document.documentElement.style;
      root.setProperty("--card-bg", base.card);
      root.setProperty("--bar-bg", base.bar);
      root.setProperty("--ring-core", base.ringCore);
      root.setProperty("--mut", base.mut);
      root.setProperty("--card-border", base.border);
      root.setProperty("--ac", base.ac);
      root.setProperty("--cloud-color", base.cloud);
      root.setProperty("--shade-grad", base.shadeGrad);

      const photoMap = { dawn: "skyDawn", morning: "skyDay", day: "skyDay", golden: "skySunset", twilight: "skyNight", night: "skyNight" };
      const activeId = photoMap[phaseKey] || "skyNight";
      ["skyNight", "skyDay", "skySunset", "skyDawn"].forEach(id => {
        $id(id)?.classList.toggle("on", id === activeId);
      });
      const skyFilter =
        kind === "storm" ? "brightness(0.48) saturate(0.45) contrast(1.15)" :
        kind === "rain" ? "brightness(0.68) saturate(0.55) contrast(1.05)" :
        kind === "cloud" || kind === "fog" ? "brightness(0.84) saturate(0.65)" :
        phaseKey === "twilight" ? "brightness(0.82) saturate(1.1) hue-rotate(8deg)" :
        "brightness(1) saturate(1.06)";
      $id("skyPhotos").style.filter = skyFilter;
    }

    // Position Sun vs Realistic Moon along orbital arc
    const sunEl = $id("sunOrb"), moonEl = $id("moonOrb");
    const daySpan = Math.max(1, setHr - riseHr);
    const flareEl = $id("sunFlare");
    if (!isNight) {
      const p = clamp((hourFloat - riseHr) / daySpan, 0, 1);
      const sx = 18 + 64 * p;
      const sy = 15 - 6 * Math.sin(Math.PI * p) + 4;
      sunEl.style.left = sx + "%";
      sunEl.style.top = sy + "%";
      sunEl.style.opacity = kind === "clear" ? "1" : kind === "partly" ? "0.96" : kind === "cloud" ? "0.62" : "0.28";
      moonEl.style.opacity = "0";

      // Diagonal optical sun flare & soft prism halo matching daytime screenshots
      const showFlare = (kind === "clear" || kind === "partly") && (phaseKey === "morning" || phaseKey === "day" || phaseKey === "dawn" || phaseKey === "golden");
      flareEl.style.opacity = showFlare ? (kind === "clear" ? "0.88" : "0.72") : "0";
      const dx = 50 - sx;
      $id("flareHalo").style.left = (sx + dx * 0.28) + "%";
      $id("flareHalo").style.top = (sy + 10) + "%";
      $id("bokeh1").style.left = (sx + dx * 0.42) + "%";
      $id("bokeh1").style.top = (sy + 14) + "%";
      $id("bokeh2").style.left = (sx + dx * 0.62) + "%";
      $id("bokeh2").style.top = (sy + 21) + "%";
      $id("bokeh3").style.left = (sx + dx * 0.82) + "%";
      $id("bokeh3").style.top = (sy + 29) + "%";
    } else {
      flareEl.style.opacity = "0";
      const nightLen = 24 - daySpan;
      const nProg = hourFloat >= setHr ? (hourFloat - setHr) / nightLen : (hourFloat + 24 - setHr) / nightLen;
      const p = clamp(nProg, 0, 1);
      moonEl.style.left = (18 + 64 * p) + "%";
      moonEl.style.top = (20 - 6 * Math.sin(Math.PI * p)) + "%";
      moonEl.style.opacity = kind === "clear" ? "1" : kind === "partly" ? "0.82" : "0.25";
      $id("moonSkyMask").innerHTML = moonPhaseShadowSVG(moonP, "sky");
      sunEl.style.opacity = "0";
    }

    startLiveClouds(phaseKey, kind);
    const nextFx = (kind === "rain" || kind === "storm" || kind === "snow") ? kind : (isNight && (kind === "clear" || kind === "partly") ? "stars" : "");
    if (nextFx !== fxMode) runSkyParticles(nextFx);
    return base.label;
  }

  function runSkyParticles(mode) {
    fxMode = mode;
    cancelAnimationFrame(fxRaf);
    const cv = $id("fx"), ctx = cv.getContext("2d");
    const dpr = Math.min(devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!mode) return;

    const isStars = mode === "stars", isSnow = mode === "snow";
    const pts = Array.from({ length: isStars ? 105 : isSnow ? 55 : 75 }, () => ({
      x: Math.random() * W,
      y: Math.random() * H * (isStars ? 0.65 : 1),
      v: isStars ? Math.random() * 6 : isSnow ? 0.6 + Math.random() * 1.3 : 11 + Math.random() * 7,
      r: isStars ? 0.5 + Math.random() * 1.4 : isSnow ? 1.2 + Math.random() * 2.4 : 0
    }));
    let t = 0, flash = 0, meteor = null;

    (function loop() {
      ctx.clearRect(0, 0, W, H);
      t += 0.02;
      if (mode === "storm" && flash <= 0 && Math.random() < 0.005) flash = 1;
      if (flash > 0) {
        ctx.fillStyle = `rgba(220,235,255,${flash * 0.22})`;
        ctx.fillRect(0, 0, W, H);
        flash -= 0.07;
      }
      if (isStars && !meteor && Math.random() < 0.003) meteor = { x: Math.random() * W * 0.75, y: Math.random() * H * 0.25, l: 0 };
      if (meteor) {
        meteor.l += 8;
        ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, 1 - meteor.l / 150)})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(meteor.x + meteor.l, meteor.y + meteor.l * 0.45); ctx.lineTo(meteor.x + meteor.l - 38, meteor.y + meteor.l * 0.45 - 17); ctx.stroke();
        if (meteor.l > 160) meteor = null;
      }
      ctx.strokeStyle = "rgba(210,232,255,0.34)";
      ctx.lineWidth = 1.15;
      pts.forEach(p => {
        if (isStars) {
          ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.68 * Math.abs(Math.sin(t + p.v))})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
          return;
        }
        p.y += p.v;
        p.x += isSnow ? Math.sin(p.y / 28 + p.r) * 0.55 : -1.8;
        if (p.y > H) { p.y = -10; p.x = Math.random() * W; }
        if (isSnow) {
          ctx.fillStyle = `rgba(255,255,255,${0.55 + p.r / 6})`;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 2, p.y - 13); ctx.stroke();
        }
      });
      fxRaf = requestAnimationFrame(loop);
    })();
  }

  // =========================================================
  // FETCH LIVE OPEN-METEO DATA
  // =========================================================
  async function loadWeather() {
    document.body.classList.add("busy");
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,dew_point_2m&hourly=temperature_2m,precipitation_probability,weather_code,is_day,uv_index,relative_humidity_2m,wind_speed_10m,visibility&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&timezone=auto&forecast_days=7`;
      const [weather, air] = await Promise.all([
        fetchJSON(url),
        fetchJSON(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${state.lat}&longitude=${state.lon}&current=us_aqi,pm2_5,pm10,nitrogen_dioxide,ozone,sulphur_dioxide,carbon_monoxide&timezone=auto`).catch(() => null)
      ]);
      state.data = weather;
      state.air = air;
      state.selHour = 0;
      state.simHour = null;
      state.simKind = null;
      let ix = weather.hourly.time.indexOf(weather.current.time.slice(0, 13) + ":00");
      state.ix = ix >= 0 ? ix : 0;
      renderAll();
    } catch {
      toast("Couldn’t load live weather. Check connection.", 3500);
    } finally {
      document.body.classList.remove("busy");
    }
  }

  // =========================================================
  // RENDER ALL SECTIONS
  // =========================================================
  function aqiMeta(v) {
    if (v == null) return { lbl: "Unavailable", desc: "Air quality readings aren't available for this location right now." };
    if (v <= 50) return { lbl: "Good", desc: "Air quality is clean and poses little or no risk for outdoor activities." };
    if (v <= 100) return { lbl: "Moderate", desc: "Air quality is acceptable. However, unusually sensitive people should consider reducing outdoor activity." };
    if (v <= 150) return { lbl: "Sensitive", desc: "Members of sensitive groups may experience health effects. Limit prolonged outdoor exertion." };
    if (v <= 200) return { lbl: "Unhealthy", desc: "Everyone may begin to experience health effects; reduce strenuous outdoor exercise." };
    return { lbl: "Very Unhealthy", desc: "Health alert: avoid prolonged outdoor exposure and wear a protective mask." };
  }

  function renderHeroAndSky() {
    if (!state.data) return;
    const d = state.data, cur = d.current, hr = d.hourly, dy = d.daily;
    const isSim = state.simHour != null;
    const idx = state.ix + state.selHour;
    const isNow = state.selHour === 0 && !isSim;

    const timeIso = isNow ? cur.time : hr.time[idx];
    const dt = new Date(timeIso);
    const rise = new Date(dy.sunrise[0]), set = new Date(dy.sunset[0]);
    const riseHr = rise.getHours() + rise.getMinutes() / 60;
    const setHr = set.getHours() + set.getMinutes() / 60;
    const hrFloat = isSim ? state.simHour : (dt.getHours() + dt.getMinutes() / 60);

    const code = isNow ? cur.weather_code : hr.weather_code[idx];
    const kind = state.simKind || wmoKind(code);
    const temp = isNow ? cur.temperature_2m : hr.temperature_2m[idx];
    const mp = moonPhase(dt.getTime());

    const phaseLbl = applyLiveSky(hrFloat, riseHr, setHr, kind, mp.p);
    const aqi = state.air?.current?.us_aqi;
    const aqiStr = aqi != null ? `Air quality: ${round(aqi)} – ${aqiMeta(aqi).lbl}` : "";

    $id("cityName").textContent = state.city;
    $id("tempVal").textContent = round(toTemp(temp));
    $id("heroMeta").innerHTML = `${wmoText(code)} <span>${fmtTemp(dy.temperature_2m_min[0])} / ${fmtTemp(dy.temperature_2m_max[0])}</span>${aqiStr ? ` <span>${aqiStr}</span>` : ""}`;
    $id("phaseTxt").textContent = isSim
      ? `Sky Preview · ${String(Math.floor(hrFloat)).padStart(2, "0")}:00 · ${phaseLbl}`
      : `${phaseLbl} · ${fmtClock(timeIso)}`;
    $id("previewBar").classList.toggle("off", isNow);
    document.title = `${fmtTemp(cur.temperature_2m)} ${state.city} — SkyVista`;
  }

  function renderHourlyStrip() {
    const hr = state.data.hourly, dy = state.data.daily, ix = state.ix;
    const rise = new Date(dy.sunrise[0]), set = new Date(dy.sunset[0]);
    const riseNext = dy.sunrise[1] ? new Date(dy.sunrise[1]) : null;
    const items = [];

    for (let k = 0; k < 24; k++) {
      const idx = ix + k;
      if (!hr.time[idx]) break;
      const t = new Date(hr.time[idx]);
      items.push(`<div class="hr-item${k === state.selHour && state.simHour == null ? " sel" : ""}" data-hr="${k}">
        <span class="hr-time">${k === 0 ? "Now" : fmtHr(hr.time[idx])}</span>
        <div class="hr-ic">${miniIcon(wmoKind(hr.weather_code[idx]), hr.is_day[idx])}</div>
        <span class="hr-temp">${fmtTemp(hr.temperature_2m[idx])}</span>
      </div>`);

      // Insert Sunrise or Sunset inline between hours (just like Screenshot 4!)
      const nextT = hr.time[idx + 1] ? new Date(hr.time[idx + 1]) : null;
      if (nextT) {
        [rise, riseNext].forEach(ev => {
          if (ev && ev > t && ev < nextT) {
            items.push(`<div class="hr-item" data-hr="${k}">
              <span class="hr-time">${fmtClock(ev)}</span>
              <div class="hr-ic">${miniIcon("sunrise", 1)}</div>
              <span class="hr-temp">${fmtTemp(hr.temperature_2m[idx])}</span>
            </div>`);
          }
        });
        if (set > t && set < nextT) {
          items.push(`<div class="hr-item" data-hr="${k}">
            <span class="hr-time">${fmtClock(set)}</span>
            <div class="hr-ic">${miniIcon("sunset", 1)}</div>
            <span class="hr-temp">${fmtTemp(hr.temperature_2m[idx])}</span>
          </div>`);
        }
      }
    }
    $id("hourlyStrip").innerHTML = items.join("");
  }

  // Multi-day Forecast: Dual Smooth SVG Spline Curves (Line) + Range Bars (List)
  function renderMultiDay() {
    const dy = state.data.daily;
    const n = Math.min(7, dy.time.length);
    const highs = dy.temperature_2m_max.slice(0, n).map(toTemp);
    const lows = dy.temperature_2m_min.slice(0, n).map(toTemp);
    const minAll = Math.min(...lows) - 2, maxAll = Math.max(...highs) + 2, span = maxAll - minAll || 1;

    // SVG dimensions
    const W = 560, H = 112, colW = W / n;
    const xs = Array.from({ length: n }, (_, k) => colW * (k + 0.5));
    const yMap = v => 14 + (1 - (v - minAll) / span) * (H - 28);
    const hiYs = highs.map(yMap), loYs = lows.map(yMap);

    const smoothPath = ys => ys.reduce((acc, y, k) => {
      if (k === 0) return `M ${xs[0].toFixed(1)} ${y.toFixed(1)}`;
      const mx = ((xs[k - 1] + xs[k]) / 2).toFixed(1);
      return `${acc} C ${mx} ${ys[k - 1].toFixed(1)}, ${mx} ${y.toFixed(1)}, ${xs[k].toFixed(1)} ${y.toFixed(1)}`;
    }, "");

    const dots = ys => ys.map((y, k) => `<circle cx="${xs[k].toFixed(1)}" cy="${y.toFixed(1)}" r="4.2" fill="#ffffff" stroke="rgba(10,18,44,0.8)" stroke-width="1.5"/>`).join("");

    const topCols = dy.time.slice(0, n).map((ds, k) => {
      const dt = new Date(ds + "T12:00");
      const dayLbl = k === 0 ? "Today" : k === 1 ? "Tomorrow" : dt.toLocaleDateString([], { weekday: "short" });
      const dateLbl = dt.toLocaleDateString([], { day: "numeric", month: "short" });
      const rp = dy.precipitation_probability_max[k] ?? 0;
      return `<div class="md-col">
        <span class="md-day">${dayLbl}</span>
        <span class="md-date">${dateLbl}</span>
        <span class="md-cond">${wmoText(dy.weather_code[k])}</span>
        <div class="md-ic">${miniIcon(wmoKind(dy.weather_code[k]), 1)}</div>
        <span class="md-rain">${rp >= 20 ? rp + "%" : ""}</span>
        <span class="md-hi">${fmtTemp(dy.temperature_2m_max[k])}</span>
      </div>`;
    }).join("");

    const botCols = dy.time.slice(0, n).map((_, k) => `<div class="md-col"><span class="md-lo">${fmtTemp(dy.temperature_2m_min[k])}</span></div>`).join("");

    $id("mdLineView").innerHTML = `<div class="md-inner">
      <div class="md-cols">${topCols}</div>
      <div class="md-svg-wrap">
        <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
          <path d="${smoothPath(hiYs)}" fill="none" stroke="rgba(220,232,255,0.52)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="${smoothPath(loYs)}" fill="none" stroke="rgba(220,232,255,0.42)" stroke-width="2.2" stroke-linecap="round"/>
          ${dots(hiYs)}
          ${dots(loYs)}
        </svg>
      </div>
      <div class="md-cols">${botCols}</div>
    </div>`;

    // List View
    $id("mdListView").innerHTML = dy.time.slice(0, n).map((ds, k) => {
      const dt = new Date(ds + "T12:00");
      const dayLbl = k === 0 ? "Today" : k === 1 ? "Tomorrow" : dt.toLocaleDateString([], { weekday: "short" });
      const lo = toTemp(dy.temperature_2m_min[k]), hi = toTemp(dy.temperature_2m_max[k]);
      const left = ((lo - minAll) / span * 100).toFixed(1);
      const width = Math.max(10, (hi - lo) / span * 100).toFixed(1);
      return `<div class="md-list-row">
        <div><b>${dayLbl}</b><div style="font-size:11.5px;color:var(--mut)">${dt.toLocaleDateString([], { day: "numeric", month: "short" })}</div></div>
        <div style="width:26px;height:26px">${miniIcon(wmoKind(dy.weather_code[k]), 1)}</div>
        <div class="bar2"><i style="left:${left}%;width:${width}%"></i></div>
        <div style="text-align:right"><b>${fmtTemp(dy.temperature_2m_max[k])}</b> <span style="color:var(--mut)">${fmtTemp(dy.temperature_2m_min[k])}</span></div>
      </div>`;
    }).join("");
  }

  function renderAQICard() {
    const v = state.air?.current?.us_aqi;
    const m = aqiMeta(v);
    $id("aqiTitle").innerHTML = v != null ? `${m.lbl} <b>${round(v)}</b>` : "Unavailable";
    $id("aqiDesc").textContent = m.desc;

  }

  function render6Grid() {
    const cur = state.data.current, hr = state.data.hourly, ix = state.ix;
    const uv = round(hr.uv_index?.[ix] ?? 0);
    const uvTxt = uv < 2 ? "Very weak" : uv < 5 ? "Moderate" : uv < 8 ? "High" : "Very high";
    const vis = hr.visibility?.[ix] != null ? round(hr.visibility[ix] / 1000) : 16;
    const dir = compassDir(cur.wind_direction_10m ?? 0);

    const tiles = [
      { ic: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M19.1 4.9L17 7M7 17l-2.1 2.1"/>', lbl: "UV", val: `${uv}<small>${uvTxt}</small>` },

  function renderSunTimeline() {
    const cur = state.data.current, dy = state.data.daily;
    const now = new Date(cur.time), rise = new Date(dy.sunrise[0]), set = new Date(dy.sunset[0]), nextRise = new Date(dy.sunrise[1] || +rise + 864e5);
    const isDay = now >= rise && now <= set;

    let leftLbl, rightLbl, leftTime, rightTime, prog;
    if (isDay) {
      leftLbl = "Sunrise"; rightLbl = "Sunset";
      leftTime = fmtClockParts(rise); rightTime = fmtClockParts(set);
      prog = clamp((now - rise) / (set - rise) * 100, 4, 96);
    } else {
      leftLbl = "Sunset"; rightLbl = "Sunrise";
      const prevSet = now < rise ? new Date(set - 864e5) : set;
      const upcomingRise = now < rise ? rise : nextRise;
      leftTime = fmtClockParts(prevSet); rightTime = fmtClockParts(upcomingRise);
      prog = clamp((now - prevSet) / (upcomingRise - prevSet) * 100, 4, 96);
    }

    const sunUpIc = '<path d="M4 18h16M8 18a4 4 0 0 1 8 0M12 6v5m0-5l-2.5 2.5M12 6l2.5 2.5"/>';
    const sunDnIc = '<path d="M4 18h16M8 18a4 4 0 0 1 8 0M12 6v5m0 0l-2.5-2.5M12 11l2.5-2.5"/>';
    const markerSvg = isDay
      ? `<svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="6" fill="#fde047"/><g stroke="#fde047" stroke-width="2" stroke-linecap="round"><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></g></svg>`
      : `<svg viewBox="0 0 24 24" width="24" height="24"><path d="M18 14.5A7 7 0 0 1 9.5 6a7 7 0 1 0 8.5 8.5z" fill="#ffffff"/><path d="M17.5 5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4L15.5 7l1.4-.6z" fill="#ffffff"/></svg>`;

    $id("sunCard").innerHTML = `
      <div class="sun-glow" style="background:radial-gradient(circle at ${prog}% 52%, ${isDay ? "rgba(255,190,90,0.22)" : "rgba(72,118,255,0.26)"}, transparent 60%)"></div>
      <div class="sun-row">
        <div class="sun-end"><svg viewBox="0 0 24 24">${leftLbl === "Sunrise" ? sunUpIc : sunDnIc}</svg><span>${leftLbl}</span></div>
        <div class="sun-end right"><svg viewBox="0 0 24 24">${rightLbl === "Sunrise" ? sunUpIc : sunDnIc}</svg><span>${rightLbl}</span></div>
      </div>
      <div class="sun-track">
        <div class="sun-fill" style="width:${prog}%"></div>
        <div class="sun-marker" style="left:${prog}%">${markerSvg}</div>
      </div>
      <div class="sun-times">
        <span>${leftTime.hm}<small>${leftTime.ap}</small></span>
        <span>${rightTime.hm}<small>${rightTime.ap}</small></span>
      </div>`;
  }

  function renderMoonCard() {
    const cur = state.data.current, dy = state.data.daily;
    const now = new Date(cur.time);

    // Approximate moonrise/moonset offset from sunrise based on lunar phase angle (real astronomical relationship: ~50 min shift per lunar day)

    const moonriseMs = riseBase + mp.p * 24 * 36e5;
    const moonsetMs = moonriseMs + 12.2 * 36e5;
    const mr = fmtClockParts(new Date(moonriseMs % 864e5 + new Date(cur.time.slice(0, 10) + "T00:00").getTime()));

  function renderAlert() {
    const cur = state.data.current, dy = state.data.daily;
    const uv = dy.uv_index_max[0] ?? 0, aqi = state.air?.current?.us_aqi;
    let msg = "";
    if ([95, 96, 99].includes(cur.weather_code)) msg = "Thunderstorm nearby. Stay indoors until lightning passes.";
    else if (cur.temperature_2m >= 38) msg = "Extreme heat warning. Hydrate regularly and avoid afternoon sun.";
    else if (cur.wind_gusts_10m >= 60) msg = `Strong wind gusts up to ${toWind(cur.wind_gusts_10m)} ${windUnit()}.`;
    else if (aqi > 150) msg = `Poor Air Quality (AQI ${round(aqi)}). Limit prolonged outdoor activity.`;
    else if (uv >= 8) msg = `Very High UV (${round(uv)}). Apply sunscreen and seek midday shade.`;
    $id("alertSlot").innerHTML = msg ? `<div class="alert-box"><span>⚠️</span><span>${msg}</span></div>` : "";
  }

  // =========================================================
  // 4-CHANNEL WEB AUDIO SOUNDSCAPE MIXER
  // =========================================================
  const sound = {
    on: false, ctx: null, master: null,
    ch: {
      rain: { label: "Rain & Drizzle", icon: "🌧️", val: 0.5, g: null },
      thunder: { label: "Deep Thunder", icon: "⛈️", val: 0.15, g: null },
      wind: { label: "Mountain Wind", icon: "🍃", val: 0.3, g: null },
      night: { label: "Night Ambience", icon: "🌙", val: 0.25, g: null }
    }
  };
  function initAudio() {
    if (sound.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC(); sound.ctx = ctx;
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const m = ctx.createGain(); m.gain.value = 0; m.connect(ctx.destination); sound.master = m;
    const mk = (t, f, q) => { const fl = ctx.createBiquadFilter(); fl.type = t; fl.frequency.value = f; fl.Q.value = q; const g = ctx.createGain(); g.gain.value = 0; src.connect(fl); fl.connect(g); g.connect(m); return g; };
    sound.ch.rain.g = mk("bandpass", 2400, 0.7);
    sound.ch.thunder.g = mk("lowpass", 160, 0.8);
    sound.ch.wind.g = mk("bandpass", 520, 1.4);
    sound.ch.night.g = mk("highpass", 4200, 0.5);
    src.start();
  }
  function updateAudio() {
    if (!sound.ctx) return;
    sound.ctx.resume();
    const now = sound.ctx.currentTime;
    sound.master.gain.setTargetAtTime(sound.on ? 0.55 : 0, now, 0.3);
    Object.values(sound.ch).forEach(c => c.g?.gain.setTargetAtTime(c.val * 0.7, now, 0.25));
  }

  function openTool(tool) {
    if (!state.data) return;

    if (tool === "radar") {
      openSheet("Live Sky Radar & Regional Pins", `
        <div id="radmap" class="radar-map"></div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button id="radPlay">▶ Play Radar</button>
          <button id="radCenter">◎ Center ${esc(state.city)}</button>
          <span id="radTime" style="margin-left:auto;font-size:12.5px;color:var(--mut)">Loading frames…</span>
        </div>
        <div style="font-size:12.5px;color:var(--mut)">Tap any temperature pin on the map to switch your forecast.</div>
      `, async body => {
        if (typeof L === "undefined") { body.querySelector("#radTime").textContent = "Map unavailable offline."; return; }
        radarMap = L.map(body.querySelector("#radmap"), { attributionControl: false }).setView([state.lat, state.lon], 7);
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 14 }).addTo(radarMap);
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 14, opacity: 0.75 }).addTo(radarMap);

        const pins = [
          { city: "Uttarkashi", country: "India", lat: 30.7268, lon: 78.4354 },
          { city: "Dehradun", country: "India", lat: 30.3165, lon: 78.0322 },
          { city: "Mussoorie", country: "India", lat: 30.4598, lon: 78.0644 },
          { city: "Rishikesh", country: "India", lat: 30.0869, lon: 78.2676 },
          { city: "Delhi", country: "India", lat: 28.6139, lon: 77.2090 }
        ];
        if (!pins.some(p => Math.abs(p.lat - state.lat) < 0.08 && Math.abs(p.lon - state.lon) < 0.08)) {
          pins.unshift({ city: state.city, country: state.country, lat: state.lat, lon: state.lon });
        }
        try {
          const res = await fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${pins.map(p => p.lat).join(",")}&longitude=${pins.map(p => p.lon).join(",")}&current=temperature_2m&timezone=auto`);
          const arr = Array.isArray(res) ? res : [res];
          pins.forEach((p, idx) => {
            const t = arr[idx]?.current?.temperature_2m;
            const mk = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", html: `<div class="radar-pin">${esc(p.city)} ${t != null ? fmtTemp(t) : ""}</div>`, iconSize: [0, 0] }) }).addTo(radarMap);
            mk.on("click", () => { selectAndSaveCity(p.city, p.country, p.lat, p.lon); closeSheet(); });
          });
        } catch {}

        let layers = [], frames = [], idx = 0;
        try {
          const rv = await fetchJSON("https://api.rainviewer.com/public/weather-maps.json");
          const host = rv.host || "https://tilecache.rainviewer.com";
          frames = (rv.radar?.past || []).slice(-6).map(f => ({ time: f.time, url: `${host}${f.path}/256/{z}/{x}/{y}/2/1_1.png` }));
          layers = frames.map(f => L.tileLayer(f.url, { opacity: 0, zIndex: 10, maxZoom: 12 }).addTo(radarMap));
          const show = i => { layers.forEach((l, k) => l.setOpacity(k === i ? 0.65 : 0)); body.querySelector("#radTime").textContent = "Radar · " + fmtClock(new Date(frames[i].time * 1000)); };
          if (frames.length) { idx = frames.length - 1; show(idx); }
          body.querySelector("#radPlay").onclick = () => {
            if (radarTimer) { clearInterval(radarTimer); radarTimer = null; body.querySelector("#radPlay").textContent = "▶ Play Radar"; return; }
            body.querySelector("#radPlay").textContent = "⏸ Pause";
            radarTimer = setInterval(() => { idx = (idx + 1) % layers.length; show(idx); }, 850);
          };
        } catch { body.querySelector("#radTime").textContent = "Radar tiles unavailable."; }
        body.querySelector("#radCenter").onclick = () => radarMap.setView([state.lat, state.lon], 8);
      });
      return;
    }

    if (tool === "skylab") {
      const hNow = state.simHour != null ? Math.floor(state.simHour) : new Date(state.data.current.time).getHours();
      openSheet("Live Sky Time & Weather Preview", `
        <div style="font-size:13.5px;color:var(--mut)">Drag the time slider to watch the live background transform from Dawn → Day → Golden Hour → Starry Night.</div>

      });
      return;
    }

    if (tool === "compare") {
      const pool = [...new Map([[state.city, { city: state.city, lat: state.lat, lon: state.lon }], ...state.saved.map(c => [c.city, c]), ...POPULAR.map(p => [p[0], { city: p[0], lat: p[2], lon: p[3] }])]).values()];
      openSheet("Side-by-Side City Comparator", `
        <div class="cmp-pick">
          <select id="cA">${pool.map(p => `<option value="${esc(p.city)}">${esc(p.city)}</option>`).join("")}</select>
          <span style="color:var(--mut);font-size:12px;font-weight:600">VS</span>
          <select id="cB">${pool.map((p, i) => `<option value="${esc(p.city)}" ${i === 1 ? "selected" : ""}>${esc(p.city)}</option>`).join("")}</select>
        </div>
        <div id="cmpOut"><div style="color:var(--mut);font-size:13.5px">Loading comparison…</div></div>
      `, body => {
        const run = async () => {
          const a = pool.find(p => p.city === body.querySelector("#cA").value) || pool[0];
          const b = pool.find(p => p.city === body.querySelector("#cB").value) || pool[1];
          const out = body.querySelector("#cmpOut");
          out.innerHTML = '<div style="color:var(--mut);font-size:13.5px">Comparing live weather…</div>';
          try {
            const [wa, wb] = await Promise.all([
              fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${a.lat}&longitude=${a.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`),
              fetchJSON(`https://api.open-meteo.com/v1/forecast?latitude=${b.lat}&longitude=${b.lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`)
            ]);
            const sc = w => clamp(round(100 - Math.max(0, w.current.temperature_2m - 30) * 5 - Math.max(0, 12 - w.current.temperature_2m) * 3 - (w.daily.precipitation_probability_max[0] ?? 0) * 0.4));
            const sa = sc(wa), sb = sc(wb);
            const col = (p, w, s, win) => `<div class="cmp-col${win ? " win" : ""}">
              <div style="display:flex;justify-content:space-between"><b>${esc(p.city)}</b><span style="color:${win ? "#6ee7b7" : "var(--mut)"};font-size:12px">${win ? "★ " : ""}${s}</span></div>
              <div style="font-size:30px;font-weight:300;margin:6px 0">${fmtTemp(w.current.temperature_2m)}</div>
              <div style="font-size:12.5px;color:var(--mut);margin-bottom:8px">${wmoText(w.current.weather_code)}</div>
              <div class="kv"><span>H/L</span><b>${fmtTemp(w.daily.temperature_2m_max[0])}/${fmtTemp(w.daily.temperature_2m_min[0])}</b></div>
              <div class="kv"><span>Rain</span><b>${w.daily.precipitation_probability_max[0] ?? 0}%</b></div>
              <div class="kv"><span>Wind</span><b>${toWind(w.current.wind_speed_10m)} ${windUnit()}</b></div>
            </div>`;
            out.innerHTML = `<div class="vd" style="--vc:#6ee7b7;margin-bottom:10px"><b>${sa === sb ? "Tie on comfort" : (sa > sb ? a.city : b.city) + " has better comfort"}</b><span>${Math.max(sa, sb)}/100</span></div><div class="cmp-grid">${col(a, wa, sa, sa >= sb)}${col(b, wb, sb, sb > sa)}</div>`;
          } catch { out.innerHTML = '<div style="color:var(--mut)">Comparison unavailable.</div>'; }
        };
        body.querySelector("#cA").onchange = run;
        body.querySelector("#cB").onchange = run;
        run();
      });
      return;
    }

    if (tool === "mixer") {
      openSheet("4-Channel Sky Soundscape Mixer", `
        <div class="seg-row">
          <button id="mTog" class="${sound.on ? "on" : ""}">${sound.on ? "Sound Playing" : "Turn Sound On"}</button>
          <button data-mp="rain">Monsoon</button>
          <button data-mp="night">Calm Night</button>
        </div>
        <div id="mSliders"></div>
      `, body => {
        const draw = () => {
          body.querySelector("#mTog").textContent = sound.on ? "Sound Playing" : "Turn Sound On";
          body.querySelector("#mTog").classList.toggle("on", sound.on);
          body.querySelector("#mSliders").innerHTML = Object.entries(sound.ch).map(([k, c]) => `
            <div style="padding:8px 0;border-top:1px solid var(--ln)">
              <div style="display:flex;justify-content:space-between;font-size:14px"><span>${c.icon} ${c.label}</span><span style="color:var(--mut)">${round(c.val * 100)}%</span></div>
              <input type="range" class="rng" min="0" max="100" value="${round(c.val * 100)}" data-mc="${k}">
            </div>`).join("");
        };
        draw();
        body.querySelector("#mTog").onclick = () => { sound.on = !sound.on; if (sound.on) initAudio(); updateAudio(); draw(); };
        body.querySelectorAll("[data-mp]").forEach(b => b.onclick = () => {
          const p = b.dataset.mp === "rain" ? { rain: 0.75, thunder: 0.25, wind: 0.3, night: 0 } : { rain: 0, thunder: 0, wind: 0.2, night: 0.65 };
          Object.keys(p).forEach(k => sound.ch[k].val = p[k]);
          sound.on = true; initAudio(); updateAudio(); draw();
        });
        body.querySelector("#mSliders").oninput = e => {
          const k = e.target.dataset.mc; if (!k) return;
          sound.ch[k].val = +e.target.value / 100;
          e.target.previousElementSibling.lastElementChild.textContent = e.target.value + "%";
          if (!sound.on) { sound.on = true; initAudio(); }
          updateAudio();
        };
      });
      return;
    }

    if (tool === "pitch") {
      const cur = state.data.current, dy = state.data.daily;
      const rain = dy.precipitation_probability_max[0] ?? 0, hum = cur.relative_humidity_2m, cl = cur.cloud_cover;
      const dew = cur.dew_point_2m ?? (cur.temperature_2m - (100 - hum) / 5);
      const sc = clamp(round(100 - rain * 0.85 - Math.max(0, cur.wind_speed_10m - 22) * 1.4 - Math.max(0, cur.apparent_temperature - 35) * 4));
      openSheet("Cricket & Outdoor Pitch Cast", `
        <div class="vd" style="--vc:${sc >= 75 ? "#6ee7b7" : sc >= 50 ? "#fde047" : "#f87171"}"><b>${sc >= 75 ? "Great Match Conditions" : sc >= 50 ? "Playable · Watch Sky" : "High Rain / Delay Risk"}</b><span>${sc}/100</span></div>
        <div class="kv"><span>Rain Risk</span><b>${rain}%</b></div>
        <div class="kv"><span>Ball Swing Outlook</span><b>${cl >= 55 && hum >= 65 ? "High Swing" : cl >= 30 || hum >= 55 ? "Moderate Swing" : "Low Swing (Flat)"}</b></div>
        <div class="kv"><span>Evening Dew Factor</span><b>${cur.temperature_2m - dew <= 3 ? "Heavy Dew" : cur.temperature_2m - dew <= 6 ? "Light Dew" : "Dry Outfield"}</b></div>
        <div class="kv"><span>Wind &amp; Cloud Cover</span><b>${toWind(cur.wind_speed_10m)} ${windUnit()} · ${cl}% clouds</b></div>
      `);
      return;
    }

    if (tool === "packing") {
      const buildItems = n => {
        const dy = state.data.daily;
        const minT = Math.min(...dy.temperature_2m_min.slice(0, n)), maxT = Math.max(...dy.temperature_2m_max.slice(0, n));
        const maxR = Math.max(...dy.precipitation_probability_max.slice(0, n).map(v => v ?? 0));
        const maxU = Math.max(...dy.uv_index_max.slice(0, n).map(v => v ?? 0));
        const arr = [{ id: "water", t: "Reusable water bottle" }, { id: "tops", t: `${n}× ${maxT >= 28 ? "light breathable tees" : "everyday tops"}` }, { id: "shoes", t: maxR >= 40 ? "Waterproof walking shoes" : "Comfortable sneakers" }];
        if (minT <= 15) arr.push({ id: "jacket", t: minT <= 7 ? "Warm winter jacket & thermals" : "Light jacket or hoodie" });
        if (maxR >= 35) arr.push({ id: "umbrella", t: "Compact umbrella / rain shell" });
        if (maxU >= 4) arr.push({ id: "sun", t: "SPF 30+ sunscreen & sunglasses" });
        return arr;
      };
      openSheet("Smart Trip Packing List", `
        <div class="seg-row" id="pkDays">${[1, 3, 7].map(d => `<button data-pd="${d}" class="${state.packDays === d ? "on" : ""}">${d === 1 ? "Day Trip" : d + " Days"}</button>`).join("")}</div>
        <div id="pkList" style="display:flex;flex-direction:column;gap:7px"></div>
        <button id="pkCopy" class="view-btn" style="margin-top:4px">📋 Copy Packing List</button>
      `, body => {
        const draw = () => {
          const items = buildItems(state.packDays);
          body.querySelector("#pkList").innerHTML = items.map(it => `<div class="pack-item${state.packChecked[it.id] ? " done" : ""}" data-id="${it.id}"><div class="pack-box">${state.packChecked[it.id] ? "✓" : ""}</div><span>${it.t}</span></div>`).join("");
        };
        draw();
        body.querySelector("#pkDays").onclick = e => {
          const b = e.target.closest("[data-pd]"); if (!b) return;
          state.packDays = +b.dataset.pd;
          body.querySelectorAll("#pkDays button").forEach(x => x.classList.toggle("on", +x.dataset.pd === state.packDays));
          draw();
        };
        body.querySelector("#pkList").onclick = e => {
          const r = e.target.closest("[data-id]"); if (!r) return;
          state.packChecked[r.dataset.id] = !state.packChecked[r.dataset.id];
          store.set("sv11-pack", JSON.stringify(state.packChecked));
          draw();
        };
        body.querySelector("#pkCopy").onclick = () => {
          const txt = `SkyVista Packing List (${state.city}, ${state.packDays}d)\n` + buildItems(state.packDays).map(x => `${state.packChecked[x.id] ? "[x]" : "[ ]"} ${x.t}`).join("\n");
          copyText(txt, "Packing list copied.");
        };
      });
      return;
    }

    if (tool === "aqi") {
      const a = state.air?.current;
      openSheet("Air Quality Breakdown", a ? `
        <div class="vd" style="--vc:#fde047"><b>${aqiMeta(a.us_aqi).lbl}</b><span>US AQI ${round(a.us_aqi)}</span></div>
        <div style="font-size:13.5px;color:var(--mut)">${aqiMeta(a.us_aqi).desc}</div>
        <div class="kv"><span>PM2.5</span><b>${round(a.pm2_5 ?? 0)} µg/m³</b></div>
        <div class="kv"><span>PM10</span><b>${round(a.pm10 ?? 0)} µg/m³</b></div>
        <div class="kv"><span>Ozone (O₃)</span><b>${round(a.ozone ?? 0)} µg/m³</b></div>
        <div class="kv"><span>Nitrogen Dioxide (NO₂)</span><b>${round(a.nitrogen_dioxide ?? 0)} µg/m³</b></div>
      ` : '<div style="color:var(--mut)">Detailed pollutant data unavailable.</div>');
      return;
    }

    if (tool === "forecast") {
      const dy = state.data.daily;
      openSheet("7-Day Detailed Forecast", dy.time.map((ds, k) => {
        const dt = new Date(ds + "T12:00");
        return `<div class="kv"><span>${k === 0 ? "Today" : dt.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })} · ${wmoText(dy.weather_code[k])}</span><b>${fmtTemp(dy.temperature_2m_max[k])} / ${fmtTemp(dy.temperature_2m_min[k])} · ${dy.precipitation_probability_max[k] ?? 0}%</b></div>`;
      }).join(""));
      return;
    }

    // Lifestyle details
    const cur = state.data.current, dy = state.data.daily;
    openSheet("Daily Lifestyle & Health Guide", `
      <div class="kv"><span>Outfit Advice</span><b>${cur.apparent_temperature < 14 ? "Warm jacket & layers" : cur.apparent_temperature < 24 ? "Comfortable light layers" : "Breathable summer wear"}</b></div>
      <div class="kv"><span>UV Protection</span><b>Peak UV ${round(dy.uv_index_max[0] ?? 0)}</b></div>
      <div class="kv"><span>Rain Chance Today</span><b>${dy.precipitation_probability_max[0] ?? 0}% (${dy.precipitation_sum[0] ?? 0} mm)</b></div>
      <div class="kv"><span>Skin Hydration</span><b>${cur.relative_humidity_2m < 48 ? "Dry air — apply moisturiser" : "Comfortable humidity (" + cur.relative_humidity_2m + "%)"}</b></div>
      <div class="kv"><span>Driving Visibility</span><b>${round((state.data.hourly.visibility?.[state.ix] ?? 16000) / 1000)} km</b></div>
    `);
  }

  // SkyVista AI Chat Drawer
  function openAIChat() {
    openSheet("SkyVista AI · EN & Hinglish", `
      <div class="chat-msgs" id="cMsgs"></div>
      <div class="chips" id="cQuick">${["Weather today", "Kal barish hogi?", "Cricket pitch cast", "What should I wear?", "Air quality"].map(q => `<button>${q}</button>`).join("")}</div>
      <div class="search-row">
        <input id="cIn" placeholder="Ask about weather, rain, outfits…">
        <button id="cSend" style="background:var(--ac);color:#071024;font-weight:700">➤</button>
      </div>
    `, body => {
      const box = body.querySelector("#cMsgs");
      const add = (cls, txt) => { const d = document.createElement("div"); d.className = "bb " + cls; d.textContent = txt; box.appendChild(d); box.scrollTop = box.scrollHeight; };
      if (!state.chatLog.length) state.chatLog.push(["a", `Namaste! I’m SkyVista AI for ${state.city}. Ask about rain, outfits, AQI, or cricket pitch conditions.`]);
      state.chatLog.forEach(([c, t]) => add(c, t));

      const ask = q => {
        q = q.trim(); if (!q || !state.data) return;
        state.chatLog.push(["u", q]); add("u", q);
        body.querySelector("#cIn").value = "";
        const low = q.toLowerCase(), hi = /\b(kal|aaj|barish|mausam|kapde|kya|hai|hawa)\b/.test(low);
        const cur = state.data.current, dy = state.data.daily, day = /\b(tomorrow|kal)\b/.test(low) ? 1 : 0;
        let ans;
        if (/\b(rain|barish|umbrella)\b/.test(low)) ans = hi ? `${state.city} mein barish ka ${dy.precipitation_probability_max[day] ?? 0}% chance hai.` : `Rain chance in ${state.city} is ${dy.precipitation_probability_max[day] ?? 0}%.`;
        else if (/\b(wear|outfit|kapde)\b/.test(low)) ans = hi ? `Abhi ${fmtTemp(cur.apparent_temperature)} feel ho raha hai — ${cur.apparent_temperature < 16 ? "jacket pehno" : "halkey kapde theek hain"}.` : `Feels like ${fmtTemp(cur.apparent_temperature)} — ${cur.apparent_temperature < 16 ? "wear a jacket or layers" : "comfortable light clothing works great"}.`;
        else if (/\b(aqi|air|pollution)\b/.test(low)) { const a = state.air?.current?.us_aqi; ans = a != null ? `US AQI in ${state.city} is ${round(a)} (${aqiMeta(a).lbl}).` : "AQI data unavailable."; }
        else if (/\b(cricket|pitch)\b/.test(low)) ans = `Cricket outlook for ${state.city}: ${dy.precipitation_probability_max[0] ?? 0}% rain risk, ${cur.relative_humidity_2m}% humidity, wind ${toWind(cur.wind_speed_10m)} ${windUnit()}.`;
        else ans = `${state.city}: ${fmtTemp(cur.temperature_2m)}, ${wmoText(cur.weather_code)}. High ${fmtTemp(dy.temperature_2m_max[0])} / Low ${fmtTemp(dy.temperature_2m_min[0])}.`;
        state.chatLog.push(["a", ans]); add("a", ans);
      };

      body.querySelector("#cSend").onclick = () => ask(body.querySelector("#cIn").value);
      body.querySelector("#cIn").addEventListener("keydown", e => { if (e.key === "Enter") ask(e.target.value); });
      body.querySelector("#cQuick").onclick = e => { if (e.target.closest("button")) ask(e.target.textContent); };
    });
  }

  // =========================================================
  // EVENT WIRING
  // =========================================================
  $id("openPlaces").onclick = openPlacesSheet;
  $id("cityHead").onclick = openPlacesSheet;
  $id("openSettings").onclick = openSettingsSheet;
  $id("openAI").onclick = openAIChat;
  $id("openAqiDetails").onclick = () => openTool("aqi");
  $id("openForecastDetails").onclick = () => openTool("forecast");
  $id("openLifeDetails").onclick = () => openTool("lifestyle");

  $id("backLive").onclick = () => { state.selHour = 0; state.simHour = null; state.simKind = null; renderHeroAndSky(); renderHourlyStrip(); };

  $id("mdLineBtn").onclick = () => {
    state.mdMode = "line";
    $id("mdLineBtn").classList.add("on"); $id("mdListBtn").classList.remove("on");
    $id("mdLineView").classList.remove("off"); $id("mdListView").classList.add("off");
  };
  $id("mdListBtn").onclick = () => {
    state.mdMode = "list";
    $id("mdListBtn").classList.add("on"); $id("mdLineBtn").classList.remove("on");
    $id("mdListView").classList.remove("off"); $id("mdLineView").classList.add("off");
  };

  $id("hourlyStrip").addEventListener("click", e => {
    const item = e.target.closest("[data-hr]");
    if (!item) return;
    state.selHour = +item.dataset.hr;
    state.simHour = null;
    state.simKind = null;
    renderHeroAndSky();
    renderHourlyStrip();
  });

  $id("insightDots").addEventListener("click", e => {
    const b = e.target.closest("[data-ins]");
    if (!b) return;
    state.insightIdx = +b.dataset.ins;
    renderInsightCarousel();
  });

  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tool], [data-open-tool]");
    if (t) openTool(t.dataset.tool || t.dataset.openTool);
  });

  addEventListener("scroll", () => {
    $id("topbar").classList.toggle("scrolled", scrollY > 40);
  }, { passive: true });

  addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
  addEventListener("resize", () => { if (fxMode) runSkyParticles(fxMode); buildClouds(innerWidth, innerHeight); });

  // Live clock & background refresh every minute
  setInterval(() => {
    if (state.data && state.selHour === 0 && state.simHour == null) renderHeroAndSky();
  }, 60000);

  loadWeather();
})();
</script>
</body>
</html>
